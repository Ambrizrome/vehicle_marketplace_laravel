services:
  app:
    image: mcr.microsoft.com/devcontainers/php:8.1
    volumes:
      - ..:/workspaces/portfolio:cached
      - claude-code-config:/home/vscode/.claude
    environment:
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
    command: sleep infinity
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: larosite
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ../larosite.sql:/docker-entrypoint-initdb.d/larosite.sql:ro

volumes:
  claude-code-config:
    name: claude-code-config
    external: true
  db_data:
