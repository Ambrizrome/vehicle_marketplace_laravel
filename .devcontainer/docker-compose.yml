services:
  app:
    image: mcr.microsoft.com/devcontainers/php:8.1
    volumes:
      - ..:/workspaces/portfolio:cached
    command: sleep infinity
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: larosite
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ../larosite.sql:/docker-entrypoint-initdb.d/larosite.sql:ro

volumes:
  db_data: